<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — MRVConsultants</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">

<body>
  <header class="site-header">

      <a href="index.html" class="brand-logo">
        <img src="assets/images/logo/logo.png" alt="MRVConsultants Logo" class="brand-logo-img" width="48" height="48">

          <span class="brand-title">MRVConsultants</span>

    <div class="container" style="max-width: 600px;">
      <span class="section-tag">Error 404</span>

  <div class="floating-lang-dock" id="floating-lang-dock" aria-label="Language selector">

      <span class="floating-lang-icon" aria-hidden="true">🌐</span>
      <label for="floating-lang-select" class="sr-only">Choose Language</label>
      <select id="floating-lang-select" class="lang-select floating-lang-select" aria-label="Translate Website Language">
